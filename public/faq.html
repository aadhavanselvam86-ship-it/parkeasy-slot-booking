<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FAQ – ParkEasy</title><link rel="stylesheet" href="/style.css"></head><body>
<main>
  <h1>Frequently asked questions</h1>
  <div class="card" id="faqs">Loading FAQs…</div>
  <p>Can't find your answer? <a href="#" onclick="openAssistant();return false">Ask the assistant</a>.</p>
</main>
<script src="/site.js"></script>
<script>
fetch('/api/faqs').then(r => r.json()).then(list => {
  const box = document.getElementById('faqs'); box.innerHTML = '';
  list.forEach(f => { const d = document.createElement('details'), s = document.createElement('summary'), p = document.createElement('p');
    s.textContent = f.question; p.textContent = f.answer; d.append(s, p); box.append(d); });
}).catch(() => document.getElementById('faqs').textContent = 'Could not load FAQs.');
</script></body></html>
